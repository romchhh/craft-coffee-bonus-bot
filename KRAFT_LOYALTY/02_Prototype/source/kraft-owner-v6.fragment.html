support:()=>`${back('profile')}<h2>Підтримка</h2><label>Тема<select><option>Покупка</option><option>Бонуси</option><option>Доступ</option><option>Інше</option></select></label><label>Опиши питання<input placeholder="Що сталося?"></label><button data-demo="Звернення в макеті не надсилається" class="solid">Надіслати</button><p id="local-feedback" class="muted"></p>`
};
const adminNav=()=>`<aside class="side">${btn('Огляд','owner-home')}${btn('Бонуси','owner-bonuses')}${btn('Клієнти','owner-clients')}${btn('Перевірки','owner-review')}${btn('Цілі / квести','owner-quest')}</aside>`;
const ownerPages={
'owner-home':()=>`<h2>Огляд мережі</h2><div class="muted">Сьогодні · усі точки · демонстраційні показники</div><div class="box soft"><h3>Потребує уваги</h3>${row('Перевірка бонусів','1 звернення')}${btn('Розглянути →','owner-review','link')}</div><div class="grid"><div class="box"><div class="muted">Грошова виручка</div><h3>18 420 грн</h3></div><div class="box"><div class="muted">Покупки з loyalty</div><h3>86</h3></div><div class="box"><div class="muted">Списано бонусів</div><h3>640,50</h3></div></div><div class="box"><h3>Стан системи</h3><p>Синхронізація працює</p><p class="muted">Остання звірка: без розбіжностей · приклад</p></div>`,
'owner-client':()=>`<h2>Картка клієнта</h2><div class="box"><h3>Олександр · демонстраційний профіль</h3><p>Телефон: прихований</p><button data-demo="Повний номер показується лише за дозволом і журналюється">Показати телефон</button><p id="local-feedback" class="muted"></p>${row('Доступні бонуси','120,50')}${row('Кешбек','5%')}${row('Заряд','20 / 50')}</div><div class="pills"><span>Покупки · Бонуси · Заряд і статус · Завдання · Звернення · Зміни</span></div>${btn('Перевірити бонусну операцію','owner-review')}`,
'owner-review':()=>`<h2>Перевірка бонусів</h2><div class="muted">Олександр · демонстраційна операція</div><div class="box"><div class="lines">${row('Підозрілі нарахування за день','45,00')}${row('Заморожене перевищення','5,00')}</div><p>Причина: розбіжність із підтвердженим чеком</p><p class="muted">Ціль розгляду — до 3 календарних днів</p></div><label>Причина рішення<input placeholder="Вкажи результат перевірки"></label><button class="solid" data-demo="Перед виконанням буде показано наслідки й підтвердження. У макеті баланс не змінюється.">Переглянути рішення</button><p id="local-feedback" class="muted"></p>`,
'owner-quest':()=>`<h2>Нове завдання</h2><div class="muted">1. Умова → 2. Винагорода → 3. Строк → 4. Перевірка</div><div class="box"><label>Назва<input placeholder="Назва для клієнта"></label><label>Тип умови<select><option>Із погодженого набору MVP</option></select></label><label>Значення<input type="number" placeholder="Порогове значення"></label></div><button class="solid" data-screen="owner-quest-preview">Переглянути структуру наступного кроку</button>`,
'owner-quest-preview':()=>`${back('owner-quest')}<h2>Перевірка перед публікацією</h2><div class="box"><h3>Клієнт побачить</h3><p>Назва · умова · прогрес · винагорода · строк</p></div><p class="muted">Умови й винагороди підставляються з попередніх кроків. Стартовий набір ще не обрано.</p><button disabled>Опублікувати · макет</button>`
};
const customers=[
{id:'01234567',name:'Олександр',phone:'+380 XX XXX 12 34',dob:'01.03.1986',balance:'120,50',status:'5%',activity:'Сьогодні',source:'QR у кав’ярні',registered:'Крафт 7',regular:'Крафт 7',visits:18,group:'Постійні',quest:'У процесі'},
{id:'02345678',name:'Марія',phone:'+380 XX XXX 56 78',dob:'12.07.1994',balance:'64,00',status:'3%',activity:'Учора',source:'Посилання бота',registered:'Не визначено',regular:'Крафт 2',visits:9,group:'Нові',quest:'Виконано'},
{id:'03456789',name:'Андрій',phone:'+380 XX XXX 90 12',dob:'Не вказано',balance:'15,00',status:'2%',activity:'31 день тому',source:'QR у кав’ярні',registered:'Крафт 1',regular:'Крафт 1',visits:5,group:'Неактивні',quest:'Не виконано'}
];
let selectedCustomer=customers[0],clientQuery='',clientGroup='',clientLocation='',groups=['Постійні','Нові','Неактивні'],questEdit=null;
const quests=[{id:1,name:'Приклад цілі',condition:'Кількість зарахованих візитів',target:'3',reward:'20',audience:'Усі клієнти',state:'Чернетка'}];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const matches=()=>customers.filter(c=>(!clientQuery||Object.values(c).join(' ').toLowerCase().includes(clientQuery.toLowerCase()))&&(!clientGroup||c.group===clientGroup)&&(!clientLocation||c.registered===clientLocation||c.regular===clientLocation));
const clientRows=()=>matches().map(c=>`<button class="box wide" data-customer="${c.id}"><div class="row"><strong>${c.name}</strong><span>ID ${c.id}</span></div><div>${c.phone}</div><div class="muted">${c.group} · ${c.regular} · ${c.activity}</div></button>`).join('')||'<p>Клієнтів не знайдено</p>';
ownerPages['owner-home']=()=>`<h2>Огляд мережі</h2><div class="box soft"><h3>Потребує уваги</h3>${row('Перевірка бонусів','1 звернення')}${btn('Розглянути →','owner-review','link')}</div>${btn('Бонуси та показники →','owner-bonuses')}<div class="box"><h3>Стан системи</h3><p>Синхронізація працює</p><p class="muted">Демонстраційний стан</p></div>`;
ownerPages['owner-bonuses']=()=>`<h2>Бонуси</h2><p class="muted">Сьогодні · усі точки · демонстраційні дані</p><div class="grid">${[['Грошова виручка','18 420 грн'],['Покупки з loyalty','86'],['Списано бонусів','640,50'],['Нараховано бонусів','812,40'],['Заморожено бонусів','5,00']].map(([a,b])=>`<div class="box"><div class="muted">${a}</div><h3>${b}</h3></div>`).join('')}</div><p class="muted">Заморожено — поточний залишок на перевірці.</p>${btn('Переглянути заморожені бонуси →','owner-review','link')}`;
ownerPages['owner-clients']=()=>`<h2>Клієнти</h2><p class="muted">Уся мережа · доступ Owner · 3 демонстраційні профілі. Номери умовні.</p><label>Пошук<input id="client-search" value="${esc(clientQuery)}" placeholder="Ім’я, телефон, ID, дата народження, джерело…"></label><div class="row"><label>Група<select id="client-group"><option value="">Усі групи</option>${groups.map(g=>`<option ${g===clientGroup?'selected':''}>${esc(g)}</option>`).join('')}</select></label><label>Заклад<select id="client-location"><option value="">Усі заклади</option>${['Крафт 1','Крафт 2','Крафт 7'].map(g=>`<option ${g===clientLocation?'selected':''}>${g}</option>`).join('')}</select></label></div>${btn('Групи та сегменти →','owner-segments','link')}<div id="client-results">${clientRows()}</div>`;
ownerPages['owner-client']=()=>{const c=selectedCustomer;return `${back('owner-clients')}<h2>${c.name}</h2><div class="box"><div class="lines">${row('ID',c.id)}${row('Телефон',c.phone)}${row('Дата народження',c.dob)}${row('Бонуси',c.balance)}${row('Кешбек',c.status)}${row('Остання покупка',c.activity)}${row('Візитів',c.visits)}</div></div><details open><summary>Залучення й заклади</summary><div class="lines">${row('Джерело',c.source)}${row('Точка реєстрації',c.registered)}${row('Регулярно відвідує',c.regular)}${row('Група',c.group)}</div></details><details><summary>Покупки</summary><p>Демонстраційний запис · ${c.regular} · 100,00 грн</p><p>Товари: капучино, 1 шт.</p></details><details><summary>Бонуси й статус</summary><p>Доступно: ${c.balance}. У робочій картці тут буде повна історія нарахувань, списань, повернень та змін статусу.</p></details><details><summary>Цілі та квести</summary><p>Приклад цілі — ${c.quest}</p></details><details><summary>Звернення, згоди та історія змін</summary><p>Тут відображатимуться записи цього клієнта.</p></details><details><summary>Геолокація · у майбутньому</summary><p>Не збирається. Можливість маркетингового використання потребує окремої згоди й перевірки технічної доступності.</p></details>${btn('Персональна ціль / пропозиція →','owner-quest-new')}`;};
ownerPages['owner-segments']=()=>`${back('owner-clients')}<h2>Групи та сегменти</h2>${groups.map(g=>`<div class="box">${row(esc(g),customers.filter(c=>c.group===g).length+' клієнтів')}</div>`).join('')}<label>Назва групи<input id="new-group" placeholder="Наприклад, гості Крафт 7"></label><p class="muted">Вибери клієнтів для групи</p>${customers.map(c=>`<label><input style="width:auto;min-height:auto" type="checkbox" name="segment-member" value="${c.id}"> ${c.name} · ${c.id}</label>`).join('')}<button data-action="save-group">Створити групу в макеті</button><p id="group-feedback" role="status"></p>`;
ownerPages['owner-quest']=()=>`<h2>Цілі / квести</h2>${btn('Створити ціль або пропозицію','owner-quest-new','solid')}<p class="muted">Демонстраційні чернетки; умови та винагороди прикладів не є затвердженими акціями.</p>${quests.map(q=>`<div class="box"><h3>${esc(q.name)}</h3><p>${esc(q.audience)} · ${q.state}</p><button data-edit-quest="${q.id}">Редагувати</button> <button data-delete-quest="${q.id}">Видалити</button></div>`).join('')||'<p>Цілей поки немає</p>'}`;
ownerPages['owner-quest-new']=()=>{const q=quests.find(q=>q.id===questEdit)||{name:'',condition:'Кількість зарахованих візитів',target:'',reward:'',audience:''};return `${back('owner-quest')}<h2>${questEdit?'Редагувати':'Нова ціль / пропозиція'}</h2><label>Назва<input id="quest-name" value="${esc(q.name)}"></label><label>Умова<select id="quest-condition"><option>Кількість зарахованих візитів</option><option>Сума покупок</option><option>Персональна пропозиція</option></select></label><label>Порогове значення<input id="quest-target" type="number" min="0" value="${esc(q.target)}"></label><label>Винагорода, бонусів<input id="quest-reward" type="number" min="0" value="${esc(q.reward)}"></label><label>Аудиторія<select id="quest-audience"><option>Усі клієнти</option>${groups.map(g=>`<option ${q.audience==='Група: '+g?'selected':''}>Група: ${esc(g)}</option>`).join('')}${customers.map(c=>`<option ${q.audience==='Клієнт: '+c.name?'selected':''}>Клієнт: ${c.name}</option>`).join('')}</select></label><button class="solid" data-action="save-quest">Зберегти чернетку в макеті</button><p id="quest-feedback" role="status"></p>`;};
root.addEventListener('input',e=>{if(e.target.id==='client-search'){clientQuery=e.target.value;root.querySelector('#client-results').innerHTML=clientRows();}});
root.addEventListener('change',e=>{if(e.target.id==='client-group'||e.target.id==='client-location'){clientGroup=root.querySelector('#client-group').value;clientLocation=root.querySelector('#client-location').value;root.querySelector('#client-results').innerHTML=clientRows();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.customer){selectedCustomer=customers.find(c=>c.id===b.dataset.customer);screen='owner-client';render();}
if(b.dataset.editQuest){questEdit=Number(b.dataset.editQuest);screen='owner-quest-new';render();root.querySelector('#quest-condition').value=quests.find(q=>q.id===questEdit).condition;}
if(b.dataset.deleteQuest){const q=quests.find(q=>q.id===Number(b.dataset.deleteQuest));b.parentElement.innerHTML=`<p>Видалити чернетку «${esc(q.name)}»?</p><button data-confirm-delete="${q.id}">Так, видалити</button> ${btn('Скасувати','owner-quest')}`;}
if(b.dataset.confirmDelete){quests.splice(quests.findIndex(q=>q.id===Number(b.dataset.confirmDelete)),1);render();}
if(b.dataset.action==='save-group'){const name=root.querySelector('#new-group').value.trim();if(!name||groups.includes(name)){root.querySelector('#group-feedback').textContent='Вкажи нову назву групи.';return;}groups.push(name);root.querySelectorAll('[name="segment-member"]:checked').forEach(x=>customers.find(c=>c.id===x.value).group=name);render();}
if(b.dataset.action==='save-quest'){const name=root.querySelector('#quest-name').value.trim();if(!name){root.querySelector('#quest-feedback').textContent='Вкажи назву.';return;}const data={id:questEdit||Date.now(),name,condition:root.querySelector('#quest-condition').value,target:root.querySelector('#quest-target').value,reward:root.querySelector('#quest-reward').value,audience:root.querySelector('#quest-audience').value,state:'Чернетка'};const i=quests.findIndex(q=>q.id===questEdit);if(i<0)quests.push(data);else quests[i]=data;questEdit=null;screen='owner-quest';render();}
if(b.dataset.screen==='owner-quest-new'){questEdit=null;}
});

function barista(){return `<h2>Клієнт у чеку</h2><div class="box"><div class="muted">Після успішного сканування</div><h3>Олександр</h3><p>ID 0123<strong>4567</strong></p>${row('Доступні бонуси','120,50')}${row('Сума після знижок','200,00 грн')}<hr>${row('<strong>Максимум до списання</strong>','100,00')}<div class="pills"><button class="solid" data-spend="100">Максимум · 100</button><button data-spend="other">Інша сума</button></div><label id="spend-field" hidden>Сума бонусів<input id="spend-value" type="number" min="0" max="100" step="0.01"></label><p id="spend-label" class="muted">Запитай клієнта, чи бажає він використати бонуси.</p><button data-demo="Це лише макет: підтвердження, резерв і закриття чека потребують перевірки інтеграції Poster.">Перейти до підтвердження</button><p id="local-feedback" class="muted"></p></div><details><summary>Стан при невідомому результаті</summary><div class="notice">Перевіряємо результат операції. Не повторюй списання.</div></details>`;}
const menu=root.querySelector('#client-menu'),more=root.querySelector('#more-button');function closeMenu(){menu.hidden=true;more.setAttribute('aria-expanded','false');}function render(){surface.querySelector('.chrome').hidden=false;content.hidden=false;root.querySelector('#closed-preview').hidden=true;root.querySelector('#exit-app').hidden=role!=='client';surface.className='surface '+(role==='owner'?device.value:'mobile');nav.hidden=role!=='client';root.querySelector('#device-label').hidden=role!=='owner';root.querySelector('#context').textContent=role==='owner'?'Кабінет Owner':'Касовий блок';root.querySelector('#context').hidden=role==='client';root.querySelector('#more-button').hidden=role!=='client';closeMenu();content.innerHTML=role==='client'?(pages[screen]||pages.home)():role==='barista'?barista():`<div class="admin">${adminNav()}<main>${(ownerPages[screen]||ownerPages['owner-home'])()}</main></div>`;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.screen===screen?'page':'false'));}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('#client-menu'))closeMenu();return;}if(b.id==='exit-app'){closeMenu();surface.querySelector('.chrome').hidden=true;content.hidden=true;nav.hidden=true;root.querySelector('#closed-preview').hidden=false;return;}if(b.id==='reopen-app'){screen='home';render();return;}if(b.id==='more-button'){menu.hidden=!menu.hidden;more.setAttribute('aria-expanded',String(!menu.hidden));return;}if(b.id==='close-menu'){closeMenu();more.focus();return;}if(b.dataset.role){role=b.dataset.role;screen=role==='owner'?'owner-home':'home';root.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}else if(b.dataset.screen){screen=b.dataset.screen;render();}else if(b.dataset.demo){const f=root.querySelector('#local-feedback');if(f)f.textContent=b.dataset.demo;}else if(b.dataset.spend){const other=b.dataset.spend==='other';root.querySelector('#spend-field').hidden=!other;root.querySelector('#spend-label').textContent=other?'Вкажи погоджену з клієнтом суму до 100 бонусів.':'Обрано 100 бонусів. Потрібне погодження клієнта.';}});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){closeMenu();more.focus();}});device.addEventListener('change',render);render();})();
</script>
