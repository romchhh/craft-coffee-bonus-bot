<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Дата народження · Craft Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0"></script>
  <link rel="stylesheet" href="/static/birthday.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="badge"><i data-lucide="cake"></i></div>
      <h1>Дата народження</h1>
      <p>Обери день, місяць і рік — подаруємо приємність у твій день</p>
    </header>

    <div class="date-card">
      <div class="preview" id="preview" aria-live="polite">ДД.ММ.РРРР</div>
      <div class="date-fields" id="date-fields">
        <label class="date-field">
          <span>День</span>
          <select id="bd-day" autocomplete="bday-day"></select>
        </label>
        <label class="date-field">
          <span>Місяць</span>
          <select id="bd-month" autocomplete="bday-month"></select>
        </label>
        <label class="date-field">
          <span>Рік</span>
          <select id="bd-year" autocomplete="bday-year"></select>
        </label>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="confirm-btn">
        <i data-lucide="check"></i>
        Підтвердити
      </button>
      <button type="button" class="btn ghost" id="skip-btn">
        Пропустити
      </button>
    </div>
  </div>
  <script src="/static/date-fields.js"></script>
  <script src="/static/birthday.js"></script>
</body>
</html>
